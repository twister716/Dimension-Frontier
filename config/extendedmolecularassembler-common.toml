#Per-block AE power settings
[blocks]

	#Extended Molecular Assembler power settings
	[blocks.extended_molecular_assembler]
		#Multiplier for AE power consumed while this block performs EMA-managed crafting. 1.0 keeps the default cost. Blocks without crafting work keep this setting for consistency.
		# Default: 1.0
		# Range: 0.0 ~ 1.7976931348623157E308
		craftingPowerMultiplier = 1.0
		#Passive AE/t drain for this block's ME network node. Set to 0.0 to disable it.
		# Default: 0.0
		# Range: 0.0 ~ 1.7976931348623157E308
		idlePowerUsage = 0.0

